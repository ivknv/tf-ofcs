[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[project]
name = "tf-ofcs"
version = "0.1.0"
description = ""
readme = "README.md"
license = "GPLv3"
requires-python = ">=3.10,<3.11"
authors = [
    {name = "Ivan Konovalov", email = "ivknv0@gmail.com"}
]
dependencies = [
    "numpy<2",
    "plotly",
    "tensorflow==2.15.0",
    "h5py"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "ipython",
    "jupyterlab",
    "jupyterlab-lsp",
    "python-lsp-server[rope]",
    "pylsp-mypy",
    "types-tensorflow>=2.15,<2.16",
    "pytest",
    "ipywidgets",
    "kaleido"
]

[project.urls]
"Source code" = "https://github.com/ivknv/tf-ofcs"

[tool.mypy]
packages = ["tf_ofcs", "tests"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "PIE", "RUF"]
ignore = ["F403", "F405", "RUF010", "I001", "PIE790", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"

[tool.pylsp-mypy]
enabled = true
live_mode = true
strict = false
