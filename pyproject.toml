[tool.poetry]
name = "optical-communication-system"
version = "0.1.0"
description = ""
authors = ["Ivan Konovalov <ivknv0@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "^2.0.0"
matplotlib = "^3.9.1"
pyqt6 = "^6.7.1"
scipy = "^1.14.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.5.3"
mypy = "^1.10.1"
ipython = "^8.26.0"
jupyterlab = "^4.2.4"
jupyterlab-lsp = "^5.1.0"
python-lsp-server = {extras = ["rope"], version = "^1.11.0"}
pylsp-mypy = "^0.6.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
packages = ["optical_communication_system"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "PIE", "RUF"]
ignore = ["F403", "F405", "RUF010", "I001", "PIE790", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"

[tool.pylsp-mypy]
enabled = true
live_mode = true
strict = false
